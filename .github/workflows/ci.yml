name: gtm-suite-checks

on:
  push:
  pull_request:

jobs:
  contracts-and-render-tests:
    runs-on: ubuntu-latest
    env:
      # Keep stdout UTF-8 so Chinese dashboard text never mojibakes on any runner.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate suite contracts
        run: python scripts/validate-gtm-suite-contracts.py

      - name: Run dashboard render tests
        run: python -m unittest discover -s scripts -p "test_render_*.py" -v

      - name: Check golden dashboard is regenerated (no drift)
        run: |
          python scripts/render-gtm-dashboard-from-report-state.py
          if ! git diff --quiet -- artifacts/dry-runs/generic-hardware-s00-s08-s13-s14-dashboard.html; then
            echo "::error::Golden dashboard is stale. Run scripts/render-gtm-dashboard-from-report-state.py and commit the result."
            git --no-pager diff -- artifacts/dry-runs/generic-hardware-s00-s08-s13-s14-dashboard.html
            exit 1
          fi
