<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTM Dashboard</title>
  <style>
    :root {
      --paper: #f7f8fa;
      --surface: #ffffff;
      --surface-2: #eef2f6;
      --ink: #151922;
      --muted: #647084;
      --line: #d9e0ea;
      --blue: #2457d6;
      --green: #147a4d;
      --amber: #a15c00;
      --red: #b42318;
      --slate: #475569;
      --shadow: 0 8px 26px rgba(21, 25, 34, 0.08);
      --radius: 8px;
      --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--paper);
      line-height: 1.5;
      overflow-x: hidden;
    }

    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    .rail {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px 18px;
      background: #101722;
      color: #f8fafc;
      overflow-y: auto;
    }

    .brand {
      display: grid;
      gap: 6px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    .brand small,
    .rail small {
      color: #a9b4c5;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .nav {
      display: grid;
      gap: 4px;
      margin-top: 18px;
    }

    .nav a {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 6px;
      color: #e5edf7;
      font-size: 14px;
      min-width: 0;
    }

    .nav a span,
    .nav a small {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav a:hover {
      background: rgba(255, 255, 255, 0.08);
      text-decoration: none;
    }

    .main {
      min-width: 0;
      padding: 28px;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .hero {
      padding: 26px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h2, h3, p { margin-top: 0; }

    .hero h2 {
      margin: 0;
      font-size: 34px;
      line-height: 1.1;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 22px;
    }

    .meta,
    .metric-card,
    .callout,
    .tool,
    .section {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .meta {
      padding: 12px;
      min-height: 78px;
    }

    .meta span,
    .metric-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .meta strong,
    .metric-card strong {
      display: block;
      margin-top: 5px;
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      gap: 14px;
    }

    .section {
      padding: 22px;
      display: grid;
      gap: 16px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }

    .section-header h3 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0;
    }

    .source {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .badge.high { color: var(--green); background: #ecfdf3; border-color: #b7e4c7; }
    .badge.medium { color: var(--amber); background: #fff7ed; border-color: #fed7aa; }
    .badge.low,
    .badge.blocked { color: var(--red); background: #fef3f2; border-color: #fecdca; }
    .badge.hypothesis_only,
    .badge.unknown { color: var(--slate); background: #f1f5f9; border-color: #cbd5e1; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .metric-card {
      padding: 14px;
      min-height: 116px;
      display: grid;
      align-content: space-between;
      gap: 12px;
    }

    .metric-card small {
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .callout {
      padding: 14px;
      background: #f8fafc;
    }

    .callout strong {
      display: block;
      margin-bottom: 4px;
    }

    .callout.warning {
      border-color: #fed7aa;
      background: #fff7ed;
    }

    .callout.danger {
      border-color: #fecdca;
      background: #fef3f2;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }

    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      background: var(--surface-2);
      font-size: 12px;
      text-transform: uppercase;
    }

    tr:last-child td { border-bottom: 0; }

    .visual-blocks {
      display: grid;
      gap: 12px;
    }

    .visual-block {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }

    .visual-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-2);
    }

    .visual-header > div {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .visual-header > span {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      text-transform: lowercase;
    }

    .visual-header strong,
    .range-label strong,
    .rank-main strong,
    .status-item strong {
      overflow-wrap: anywhere;
    }

    .visual-header span,
    .visual-note,
    .range-label span,
    .rank-main span,
    .status-item span,
    .score-cell small {
      color: var(--muted);
      font-size: 12px;
    }

    .visual-body {
      padding: 14px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .status-item {
      display: grid;
      gap: 6px;
      min-height: 96px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfe;
    }

    .status-item b {
      color: var(--blue);
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    .rank-list,
    .range-list {
      display: grid;
      gap: 12px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: minmax(140px, 1fr) minmax(180px, 2fr) 54px;
      gap: 12px;
      align-items: center;
    }

    .rank-main {
      display: grid;
      gap: 2px;
    }

    .bar-track,
    .range-track {
      position: relative;
      min-height: 12px;
      border-radius: 999px;
      background: var(--surface-2);
      overflow: hidden;
    }

    .bar-fill {
      display: block;
      width: var(--score);
      height: 12px;
      border-radius: 999px;
      background: var(--blue);
    }

    .rank-score {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-align: right;
    }

    .score-cell span {
      display: grid;
      gap: 2px;
      min-width: 94px;
      padding: 8px;
      border-radius: 6px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--blue) 18%, transparent) var(--score), color-mix(in srgb, var(--blue) 5%, transparent) var(--score));
    }

    .score-cell strong {
      font-size: 14px;
    }

    .range-row {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) minmax(220px, 2fr) minmax(120px, auto);
      gap: 12px;
      align-items: center;
    }

    .range-label {
      display: grid;
      gap: 2px;
    }

    .range-band {
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--left);
      width: var(--width);
      border-radius: 999px;
      background: color-mix(in srgb, var(--amber) 46%, var(--surface));
    }

    .range-marker {
      position: absolute;
      top: -3px;
      left: var(--marker);
      width: 4px;
      height: 18px;
      border-radius: 999px;
      background: var(--red);
      transform: translateX(-50%);
    }

    .range-values {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
    }

    .visual-note {
      margin-top: 10px;
    }

    .list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding-left: 18px;
    }

    .tool {
      padding: 18px;
      display: grid;
      gap: 14px;
      background: #fbfcfe;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
      color: var(--ink);
      background: var(--surface);
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #c7d2e1;
      background: #ffffff;
      color: var(--ink);
      border-radius: 6px;
      min-height: 38px;
      padding: 8px 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
    }

    .footer {
      color: var(--muted);
      font-size: 13px;
      padding: 18px 2px 40px;
    }

    @media (max-width: 960px) {
      .layout { display: block; }
      .rail {
        position: static;
        height: auto;
      }
      .nav {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .summary-grid,
      .meta-grid,
      .metrics,
      .status-grid,
      .rank-row,
      .range-row,
      .tool-grid {
        grid-template-columns: 1fr;
      }
      .rank-score,
      .range-values {
        text-align: left;
      }
      .main { padding: 18px; }
      .hero h2 { font-size: 28px; }
    }

    @media (max-width: 520px) {
      .nav {
        grid-template-columns: 1fr;
      }
      .nav a small {
        display: none;
      }
      .hero {
        padding: 22px;
      }
      .hero h2 {
        font-size: 25px;
      }
    }

    @media print {
      body { background: #ffffff; }
      .layout { display: block; }
      .rail { display: none; }
      .main { padding: 0; }
      .section, .hero, .tool { box-shadow: none; break-inside: avoid; }
      button { display: none; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="rail">
      <div class="brand">
        <small id="rail-suite">GTM Intelligence</small>
        <h1 id="rail-title">看板</h1>
        <small id="rail-subtitle">静态报告</small>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>

    <main class="main">
      <div class="container">
        <section class="hero" id="executive_summary">
          <div class="hero-top">
            <div>
              <p class="eyebrow" id="report-kicker">模板预览</p>
              <h2 id="report-title">GTM 看板</h2>
            </div>
            <span class="badge unknown" id="report-status">未知</span>
          </div>
          <div class="meta-grid" id="meta-grid"></div>
        </section>

        <div class="summary-grid">
          <section class="section" id="summary-panel">
            <div class="section-header">
              <div>
                <h3>执行摘要</h3>
                <div class="source">仅由上游模块结论生成</div>
              </div>
            </div>
            <div id="summary-content"></div>
          </section>

          <section class="section" id="gap-panel">
            <div class="section-header">
              <div>
                <h3>数据缺口</h3>
                <div class="source">可见阻塞项与限制</div>
              </div>
            </div>
            <div id="gap-content"></div>
          </section>
        </div>

        <div id="sections"></div>

        <section class="section" id="citations">
          <div class="section-header">
            <div>
              <h3>证据索引</h3>
              <div class="source">由已提供的 evidence refs 渲染</div>
            </div>
          </div>
          <div id="citation-content"></div>
        </section>

        <div class="footer">
          静态离线看板。此模板不使用外部脚本、分析、遥测或网络请求。
        </div>
      </div>
    </main>
  </div>

                  ["转化假设", "S07 可选", "缺少页面时不能算真实 CVR", "上线前先做 tracking 和页面测试"]
                ]
              }
            ],
            next_actions: [
              "让用户选择 forecast horizon：launch week、30/60/90 天或自定义。",
              "如果要用于库存决策，必须补充 launch inventory、渠道分配、补货周期或 PO/sell-in 约束。",
              "把敏感性最高的 3 个假设交给 S13 变成验证计划。"
            ],
            citations: [],
            data_gaps: ["missing_inventory_context", "missing_historical_calibration", "forecast_confidence_capped"]
          }
        ],
        dataGaps: [
          { item: "Preview mode uses illustrative content only; real dashboard sections must come from S01-S08 handoffs.", severity: "medium", owner: "S14" },
          { item: "If a required S01-S08 subview is missing, S14 must flag missing_required_view instead of filling it with generic prose.", severity: "high", owner: "S14" },
          { item: "Private COGS, margin, and channel terms remain blank in public HTML unless explicitly approved.", severity: "high", owner: "S04/S14" }
        ],
        citations: [],
        privatePricingCalculator: {
          enabled: true,
          mode: "client_side_blank_inputs"
        }
      };

      const data = window.GTM_REPORT_DATA || previewData;

      function text(value) {
        return value === undefined || value === null ? "" : String(value);
      }

      function escapeHtml(value) {
        return text(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function slug(value) {
        return text(value).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "_").replace(/^_+|_+$/g, "") || "section";
      }

      function badge(value) {
        const raw = text(value || "unknown");
        const key = slug(raw);
        return '<span class="badge ' + key + '">' + escapeHtml(raw.replace(/_/g, " ")) + '</span>';
      }

      function renderList(items) {
        if (!items || !items.length) return '<p class="source">未提供项目。</p>';
        return '<ul class="list">' + items.map(function (item) {
          if (typeof item === "string") return '<li>' + escapeHtml(item) + '</li>';
          return '<li>' + escapeHtml(item.item || item.title || JSON.stringify(item)) + '</li>';
        }).join("") + '</ul>';
      }

      function renderMetricCards(cards) {
        if (!cards || !cards.length) return "";
        return '<div class="metrics">' + cards.map(function (card) {
          return '<article class="metric-card">' +
            '<div><span>' + escapeHtml(card.label || "指标") + '</span>' +
            '<strong>' + escapeHtml(card.value || "") + '</strong></div>' +
            '<small>' + escapeHtml(card.note || card.confidence || "") + '</small>' +
          '</article>';
        }).join("") + '</div>';
      }

      function renderCallouts(callouts) {
        if (!callouts || !callouts.length) return "";
        return callouts.map(function (callout) {
          const tone = slug(callout.tone || "neutral");
          return '<div class="callout ' + tone + '">' +
            '<strong>' + escapeHtml(callout.title || "提示") + '</strong>' +
            '<div>' + escapeHtml(callout.body || callout.text || "") + '</div>' +
          '</div>';
        }).join("");
      }

      function renderTables(tables) {
        if (!tables || !tables.length) return "";
        return tables.map(function (table) {
          const headers = table.headers || [];
          const rows = table.rows || [];
          if (!headers.length || !rows.length) return "";
          return '<div class="table-wrap"><table><thead><tr>' +
            headers.map(function (head) { return '<th>' + escapeHtml(head) + '</th>'; }).join("") +
            '</tr></thead><tbody>' +
            rows.map(function (row) {
              const cells = Array.isArray(row) ? row : headers.map(function (head) { return row[head] || row[slug(head)] || ""; });
              return '<tr>' + cells.map(function (cell) { return '<td>' + escapeHtml(cell) + '</td>'; }).join("") + '</tr>';
            }).join("") +
          '</tbody></table></div>';
        }).join("");
      }

      function toNumber(value, fallback) {
        const num = Number(value);
        return Number.isFinite(num) ? num : fallback;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function toPercent(value, min, max) {
        const floor = toNumber(min, 0);
        const ceiling = toNumber(max, 100);
        const range = ceiling - floor || 1;
        return clamp(((toNumber(value, floor) - floor) / range) * 100, 0, 100).toFixed(1) + "%";
      }

      function renderVisualRefs(block) {
        const rawRefs = block.evidence_refs || block.citations || [];
        const refs = Array.isArray(rawRefs) ? rawRefs : [rawRefs];
        if (!refs.length) return "";
        const labels = refs.slice(0, 6).map(function (ref) {
          if (typeof ref === "string") return ref;
          return ref.ref || ref.evidence_id || ref.id || ref.title || "";
        }).filter(Boolean);
        if (!labels.length) return "";
        const overflow = refs.length > labels.length ? " +" + (refs.length - labels.length) : "";
        return '<div class="visual-note">证据 refs: ' + labels.map(escapeHtml).join(", ") + escapeHtml(overflow) + '</div>';
      }

      function renderVisualShell(block, body) {
        const typeLabel = text(block.visual || block.type || "visual").replace(/_/g, " ");
        return '<div class="visual-block">' +
          '<div class="visual-header"><div><strong>' + escapeHtml(block.title || "证据视图") + '</strong>' +
          (block.subtitle || block.core_point ? '<span>' + escapeHtml(block.subtitle || block.core_point) + '</span>' : "") +
          '</div><span>' + escapeHtml(typeLabel) + '</span></div>' +
          '<div class="visual-body">' + body +
          (block.note ? '<div class="visual-note">' + escapeHtml(block.note) + '</div>' : "") +
          renderVisualRefs(block) +
          '</div></div>';
      }

      function renderStatusPanel(block) {
        const items = block.items || [];
        const body = items.length ? '<div class="status-grid">' + items.map(function (item) {
          return '<div class="status-item">' +
            '<strong>' + escapeHtml(item.label || item.title || "状态") + '</strong>' +
            '<b>' + escapeHtml(item.value || item.status || "") + '</b>' +
            '<span>' + escapeHtml(item.note || item.owner || item.source || "") + '</span>' +
          '</div>';
        }).join("") + '</div>' : renderList([]);
        return renderVisualShell(block, body);
      }

      function renderRankedBars(block) {
        const max = toNumber(block.max, 100);
        const items = block.items || [];
        const body = items.length ? '<div class="rank-list">' + items.map(function (item) {
          const score = toNumber(item.score, 0);
          return '<div class="rank-row">' +
            '<div class="rank-main"><strong>' + escapeHtml(item.label || item.name || "项目") + '</strong><span>' + escapeHtml(item.note || item.reason || "") + '</span></div>' +
            '<div class="bar-track"><span class="bar-fill" style="--score: ' + toPercent(score, 0, max) + '"></span></div>' +
            '<div class="rank-score">' + escapeHtml(item.score_label || String(score)) + '</div>' +
          '</div>';
        }).join("") + '</div>' : renderList([]);
        return renderVisualShell(block, body);
      }

      function renderMatrixHeatmap(block) {
        const columns = block.columns || block.headers || [];
        const rows = block.rows || [];
        const max = toNumber(block.max, 100);
        if (!columns.length || !rows.length) return renderVisualShell(block, renderList([]));
        const table = '<div class="table-wrap"><table><thead><tr><th>' + escapeHtml(block.row_label || "维度") + '</th>' +
          columns.map(function (col) { return '<th>' + escapeHtml(col) + '</th>'; }).join("") +
          '</tr></thead><tbody>' +
          rows.map(function (row) {
            const values = row.values || [];
            return '<tr><td><strong>' + escapeHtml(row.label || row.name || "") + '</strong><div class="source">' + escapeHtml(row.note || "") + '</div></td>' +
              columns.map(function (_col, index) {
                const value = values[index] || {};
                const score = typeof value === "object" ? toNumber(value.score, 0) : toNumber(value, 0);
                const label = typeof value === "object" ? (value.label || String(score)) : String(score);
                const note = typeof value === "object" ? (value.note || "") : "";
                return '<td class="score-cell"><span style="--score: ' + toPercent(score, 0, max) + '">' +
                  '<strong>' + escapeHtml(label) + '</strong>' +
                  (note ? '<small>' + escapeHtml(note) + '</small>' : "") +
                '</span></td>';
              }).join("") + '</tr>';
          }).join("") + '</tbody></table></div>';
        return renderVisualShell(block, table);
      }

      function renderRangeChart(block) {
        const scaleMin = toNumber(block.scale_min, 0);
        const scaleMax = toNumber(block.scale_max, 100);
        const items = block.items || [];
        const body = items.length ? '<div class="range-list">' + items.map(function (item) {
          const min = toNumber(item.min, scaleMin);
          const max = toNumber(item.max, scaleMax);
          const marker = item.marker === undefined ? null : toNumber(item.marker, min);
          const left = toPercent(min, scaleMin, scaleMax);
          const right = toPercent(max, scaleMin, scaleMax);
          const width = (parseFloat(right) - parseFloat(left)).toFixed(1) + "%";
          const markerHtml = marker === null ? "" : '<span class="range-marker" style="--marker: ' + toPercent(marker, scaleMin, scaleMax) + '"></span>';
          return '<div class="range-row">' +
            '<div class="range-label"><strong>' + escapeHtml(item.label || "区间") + '</strong><span>' + escapeHtml(item.note || "") + '</span></div>' +
            '<div class="range-track"><span class="range-band" style="--left: ' + left + '; --width: ' + width + '"></span>' + markerHtml + '</div>' +
            '<div class="range-values">' + escapeHtml(item.value_label || (String(min) + " - " + String(max))) + '</div>' +
          '</div>';
        }).join("") + '</div>' : renderList([]);
        return renderVisualShell(block, body);
      }

      function renderVisualBlocks(blocks) {
        if (!blocks || !blocks.length) return "";
        return '<div class="visual-blocks">' + blocks.map(function (block) {
          const type = slug(block.type || block.visual || "");
          if (type === "status_panel") return renderStatusPanel(block);
          if (type === "ranked_bar") return renderRankedBars(block);
          if (type === "matrix_heatmap") return renderMatrixHeatmap(block);
          if (type === "range_chart") return renderRangeChart(block);
          if (block.headers && block.rows) return renderVisualShell(block, renderTables([{ headers: block.headers, rows: block.rows }]));
          return renderVisualShell(block, renderList(block.items || []));
        }).join("") + '</div>';
      }

      function renderSection(section) {
        const id = section.section_id || slug(section.section_title);
        const narrative = section.narrative_blocks || [];
        return '<section class="section" id="' + escapeHtml(id) + '">' +
          '<div class="section-header"><div>' +
            '<h3>' + escapeHtml(section.section_title || id) + '</h3>' +
            '<div class="source">' + escapeHtml(section.source_skill || "未知来源") + '</div>' +
          '</div>' + badge(section.confidence || section.status || "unknown") + '</div>' +
          (section.executive_takeaway ? '<p><strong>核心结论：</strong> ' + escapeHtml(section.executive_takeaway) + '</p>' : "") +
          narrative.map(function (block) { return '<p>' + escapeHtml(block) + '</p>'; }).join("") +
          renderMetricCards(section.metric_cards) +
          renderCallouts(section.callouts) +
          renderVisualBlocks(section.visual_blocks || section.charts) +
          renderTables(section.tables) +
          (section.next_actions && section.next_actions.length ? '<div class="callout"><strong>下一步行动</strong>' + renderList(section.next_actions) + '</div>' : "") +
          (section.data_gaps && section.data_gaps.length ? '<div class="callout warning"><strong>本节数据缺口</strong>' + renderList(section.data_gaps) + '</div>' : "") +
        '</section>';
      }

      function renderPrivateCalculator() {
        const spec = data.privatePricingCalculator || {};
        if (!spec.enabled) return "";
        return '<section class="section" id="private_pricing_calculator">' +
          '<div class="section-header"><div><h3>私有价格与毛利计算器</h3>' +
          '<div class="source">仅在本地浏览器计算。默认空值且不存储。</div></div>' +
          '<span class="badge hypothesis_only">仅本地</span></div>' +
          '<div class="tool">' +
            '<div class="callout warning"><strong>隐私提示</strong><div>这里输入的数值只保留在浏览器内存中，除非你主动复制派生摘要。</div></div>' +
            '<div class="tool-grid">' +
              '<label>建议零售价<input id="calc-msrp" type="number" min="0" step="0.01" placeholder="0.00"></label>' +
              '<label>COGS / BOM 成本<input id="calc-cogs" type="number" min="0" step="0.01" placeholder="0.00"></label>' +
              '<label>目标毛利率 %<input id="calc-target-gm" type="number" min="0" max="99" step="0.1" placeholder="35"></label>' +
              '<label>渠道费用<input id="calc-channel" type="number" min="0" step="0.01" placeholder="0.00"></label>' +
              '<label>折扣<input id="calc-discount" type="number" min="0" step="0.01" placeholder="0.00"></label>' +
              '<label>物流/支付补贴<input id="calc-subsidy" type="number" min="0" step="0.01" placeholder="0.00"></label>' +
            '</div>' +
            '<div class="metrics" id="calc-results"></div>' +
            '<div class="actions"><button class="primary" id="calc-run" type="button">计算</button><button id="calc-reset" type="button">重置</button><button id="calc-copy" type="button">复制派生摘要</button></div>' +
          '</div>' +
        '</section>';
      }

      function readNumber(id) {
        const value = document.getElementById(id).value;
        const num = Number(value);
        return Number.isFinite(num) ? num : 0;
      }

      function formatMoney(value) {
        return Number.isFinite(value) ? value.toFixed(2) : "0.00";
      }

      function formatPercent(value) {
        return Number.isFinite(value) ? (value * 100).toFixed(1) + "%" : "0.0%";
      }

      function runCalculator() {
        const msrp = readNumber("calc-msrp");
        const cogs = readNumber("calc-cogs");
        const targetGm = readNumber("calc-target-gm") / 100;
        const channel = readNumber("calc-channel");
        const discount = readNumber("calc-discount");
        const subsidy = readNumber("calc-subsidy");
        const net = msrp - channel - discount - subsidy;
        const gm = net > 0 ? (net - cogs) / net : 0;
        const minNet = targetGm < 1 ? cogs / (1 - targetGm) : 0;
        const gap = net - minNet;
        const cards = [
          { label: "估算净价", value: formatMoney(net), note: "建议零售价减去可见扣减" },
          { label: "毛利率", value: formatPercent(gm), note: "本地计算" },
          { label: "毛利缺口", value: formatMoney(gap), note: gap >= 0 ? "达到或高于底线" : "低于底线" }
        ];
        document.getElementById("calc-results").innerHTML = renderMetricCards(cards);
        window.__derivedPricingSummary = "估算净价：" + formatMoney(net) + "；毛利率：" + formatPercent(gm) + "；毛利缺口：" + formatMoney(gap) + "。";
      }

      function resetCalculator() {
        ["calc-msrp", "calc-cogs", "calc-target-gm", "calc-channel", "calc-discount", "calc-subsidy"].forEach(function (id) {
          const el = document.getElementById(id);
          if (el) el.value = "";
        });
        document.getElementById("calc-results").innerHTML = "";
        window.__derivedPricingSummary = "";
      }

      function copySummary() {
        const summary = window.__derivedPricingSummary || "尚未计算派生价格摘要。";
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(summary);
        }
      }

      function initCalculator() {
        const run = document.getElementById("calc-run");
        if (!run) return;
        run.addEventListener("click", runCalculator);
        document.getElementById("calc-reset").addEventListener("click", resetCalculator);
        document.getElementById("calc-copy").addEventListener("click", copySummary);
      }

      function init() {
        const project = data.project || {};
        const sections = data.sections || [];
        document.title = project.title || "GTM 看板";
        document.getElementById("rail-title").textContent = project.product || project.title || "GTM 看板";
        document.getElementById("rail-subtitle").textContent = project.country || "静态报告";
        document.getElementById("report-kicker").textContent = data.mode === "template_preview" ? "模板预览" : "GTM 报告";
        document.getElementById("report-title").textContent = project.title || "GTM 看板";
        document.getElementById("report-status").outerHTML = badge(project.status || "unknown");

        const meta = [
          { label: "产品", value: project.product || "未提供" },
          { label: "国家/地区", value: project.country || "未提供" },
          { label: "价格段", value: project.priceRange || "未提供" },
          { label: "受众", value: project.audience || "混合" }
        ];
        document.getElementById("meta-grid").innerHTML = meta.map(function (item) {
          return '<div class="meta"><span>' + escapeHtml(item.label) + '</span><strong>' + escapeHtml(item.value) + '</strong></div>';
        }).join("");

        const takeaways = data.executiveTakeaways && data.executiveTakeaways.length
          ? data.executiveTakeaways
          : sections.map(function (s) { return s.executive_takeaway; }).filter(Boolean).slice(0, 5);
        document.getElementById("summary-content").innerHTML = renderList(takeaways);
        document.getElementById("gap-content").innerHTML = renderList(data.dataGaps || []);

        const navItems = [
          { id: "executive_summary", title: "摘要", status: "core" },
          { id: "gap-panel", title: "数据缺口", status: "core" }
        ].concat(sections.map(function (s) {
          return { id: s.section_id || slug(s.section_title), title: s.section_title || s.section_id, status: s.confidence || "" };
        })).concat([{ id: "citations", title: "证据索引", status: "index" }]);

        document.getElementById("nav").innerHTML = navItems.map(function (item) {
          return '<a href="#' + escapeHtml(item.id) + '"><span>' + escapeHtml(item.title) + '</span><small>' + escapeHtml(item.status) + '</small></a>';
        }).join("");

        document.getElementById("sections").innerHTML = sections.map(renderSection).join("") + renderPrivateCalculator();

        const citations = data.citations || [];
        document.getElementById("citation-content").innerHTML = citations.length
          ? renderTables([{ headers: ["Ref", "标题", "来源"], rows: citations.map(function (c) { return [c.ref || "", c.title || "", c.source || c.url || ""]; }) }])
          : '<p class="source">未提供证据索引。缺失的 citation metadata 应由 S14 质量门标记。</p>';

        initCalculator();
      }

      init();
    }());
  </script>
</body>
</html>
