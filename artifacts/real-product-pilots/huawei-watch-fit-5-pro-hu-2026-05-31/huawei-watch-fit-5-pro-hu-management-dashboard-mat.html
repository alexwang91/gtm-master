<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTM Dashboard Mat Theme</title>
  <style>
    :root {
      --paper: #111827;
      --canvas: #eef2f7;
      --surface: #ffffff;
      --surface-2: #f5f7fb;
      --surface-3: #e8eef6;
      --ink: #111827;
      --muted: rgba(17, 24, 39, 0.64);
      --line: rgba(17, 24, 39, 0.13);
      --blue: #2563eb;
      --green: #0f766e;
      --amber: #b7791f;
      --red: #b42318;
      --slate: #475569;
      --shadow: 0 16px 36px rgba(15, 23, 42, 0.12);
      --radius: 8px;
      --font: "Aptos", "Segoe UI", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: linear-gradient(180deg, #f7f9fc 0%, var(--canvas) 100%);
      line-height: 1.5;
      overflow-x: hidden;
    }

    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    .rail {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px 18px;
      background: #111827;
      color: #f8fafc;
      overflow-y: auto;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand {
      display: grid;
      gap: 6px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    .brand small,
    .rail small {
      color: rgba(248, 250, 252, 0.62);
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.15;
      letter-spacing: 0;
      color: #f8fafc;
    }

    .nav {
      display: grid;
      gap: 4px;
      margin-top: 18px;
    }

    .nav a {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 14px;
      min-width: 0;
    }

    .nav a span,
    .nav a small {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav a:hover {
      background: rgba(37, 99, 235, 0.18);
      text-decoration: none;
    }

    .main {
      min-width: 0;
      padding: 28px;
    }

    .container {
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      gap: 18px;
      min-width: 0;
    }

    .container > *,
    .section,
    .hero,
    .summary-grid,
    #sections,
    .visual-block,
    .visual-body,
    .table-wrap {
      min-width: 0;
    }

    .hero {
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    h2, h3, p { margin-top: 0; }

    .hero h2 {
      margin: 0;
      font-size: 34px;
      line-height: 1.1;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 22px;
    }

    .meta,
    .metric-card,
    .callout,
    .tool,
    .section {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .meta {
      padding: 12px;
      min-height: 78px;
    }

    .meta span,
    .metric-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .meta strong,
    .metric-card strong {
      display: block;
      margin-top: 5px;
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      gap: 14px;
    }

    .decision-board {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.8fr);
      gap: 14px;
      margin-top: 18px;
      align-items: stretch;
    }

    .decision-main,
    .decision-side,
    .fact-card,
    .source-tile,
    .price-card,
    .channel-card,
    .timeline-card,
    .competitor-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .decision-main {
      padding: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #f7f9fd 100%);
      border-top: 4px solid var(--blue);
    }

    .decision-main h3 {
      margin: 0 0 10px;
      font-size: 25px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .fact-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .fact-list li {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 9px 0;
      border-top: 1px solid var(--line);
    }

    .fact-list b {
      color: var(--blue);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .decision-side {
      display: grid;
      gap: 10px;
      padding: 12px;
      background: var(--surface-2);
    }

    .fact-card {
      padding: 11px;
      background: #ffffff;
    }

    .fact-card span,
    .source-tile span,
    .price-card span,
    .channel-card span,
    .timeline-card span,
    .competitor-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .fact-card strong {
      display: block;
      margin-top: 4px;
      font-size: 17px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .fact-card small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
    }

    .source-wall,
    .price-ladder,
    .channel-cards,
    .timeline-row,
    .competitor-stack {
      display: grid;
      gap: 10px;
    }

    .source-wall {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 12px;
    }

    .source-tile {
      min-height: 94px;
      padding: 12px;
      display: grid;
      align-content: space-between;
      background: #ffffff;
    }

    .source-tile a {
      color: var(--ink);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .source-mark {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      color: #ffffff;
      background: var(--blue);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .coverage-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .coverage-item {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-2);
    }

    .coverage-item strong {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
      margin-bottom: 5px;
    }

    .coverage-item b {
      color: var(--green);
      font-size: 12px;
      white-space: nowrap;
    }

    .coverage-item small {
      color: var(--muted);
    }

    .price-ladder {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: stretch;
    }

    .price-card {
      position: relative;
      padding: 13px;
      overflow: hidden;
      background: #ffffff;
    }

    .price-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: var(--price-tone, var(--amber));
    }

    .price-card strong {
      display: block;
      margin-top: 5px;
      font-family: var(--mono);
      font-size: 19px;
    }

    .price-card p,
    .channel-card p,
    .timeline-card p,
    .competitor-card p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .price-scale {
      height: 10px;
      margin-top: 11px;
      border-radius: 999px;
      background: var(--surface-2);
      overflow: hidden;
    }

    .price-scale span {
      display: block;
      height: 100%;
      width: var(--score);
      background: var(--price-tone, var(--amber));
    }

    .channel-cards {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .channel-card {
      padding: 12px;
      background: #ffffff;
    }

    .channel-card strong {
      display: block;
      margin: 4px 0 8px;
      font-size: 15px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .mini-meters {
      display: grid;
      gap: 6px;
    }

    .mini-meter {
      display: grid;
      gap: 4px;
    }

    .mini-meter small {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      gap: 6px;
    }

    .mini-meter i {
      display: block;
      height: 6px;
      border-radius: 999px;
      background: var(--surface-2);
      overflow: hidden;
    }

    .mini-meter i::after {
      content: "";
      display: block;
      width: var(--score);
      height: 100%;
      background: var(--green);
    }

    .timeline-row {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .timeline-card {
      padding: 13px;
      background: #ffffff;
    }

    .timeline-card strong {
      display: block;
      margin: 4px 0;
      font-size: 20px;
      font-family: var(--mono);
    }

    .timeline-card i {
      display: block;
      height: 8px;
      margin-top: 9px;
      border-radius: 999px;
      background: var(--surface-2);
      overflow: hidden;
    }

    .timeline-card i::after {
      content: "";
      display: block;
      width: var(--score);
      height: 100%;
      background: var(--blue);
    }

    .competitor-stack {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .competitor-card {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 11px;
      padding: 12px;
      background: #ffffff;
    }

    .competitor-rank {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--paper);
      color: #ffffff;
      font-weight: 900;
    }

    .section {
      padding: 20px;
      display: grid;
      gap: 16px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
      position: relative;
    }

    .section-header::before {
      content: "";
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 88px;
      height: 2px;
      background: var(--blue);
    }

    .section-header h3 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0;
    }

    .source {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .badge.high { color: var(--green); background: #ecfdf3; border-color: #b7e4c7; }
    .badge.medium { color: var(--amber); background: #fff7ed; border-color: #fed7aa; }
    .badge.low,
    .badge.blocked { color: var(--red); background: #fef3f2; border-color: #fecdca; }
    .badge.local_team_action { color: var(--blue); background: #eff6ff; border-color: #bfdbfe; }
    .badge.hypothesis_only,
    .badge.unknown { color: var(--slate); background: #f1f5f9; border-color: #cbd5e1; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .metric-card {
      padding: 14px;
      min-height: 116px;
      display: grid;
      align-content: space-between;
      gap: 12px;
    }

    .metric-card small {
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .callout {
      padding: 14px;
      background: var(--surface-2);
    }

    .callout strong {
      display: block;
      margin-bottom: 4px;
    }

    .callout.warning {
      border-color: rgba(183, 121, 31, 0.32);
      background: #fff8eb;
    }

    .callout.danger {
      border-color: rgba(180, 35, 24, 0.28);
      background: #fff1f2;
    }

    .local-action {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid rgba(37, 99, 235, 0.24);
      border-left: 4px solid var(--blue);
      border-radius: var(--radius);
      background: #eff6ff;
    }

    .local-action-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .local-action-head span,
    .local-action b {
      color: var(--blue);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .local-action-head strong {
      font-size: 18px;
      line-height: 1.25;
    }

    .local-action p {
      margin: 0;
    }

    .local-action-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(220px, 0.8fr);
      gap: 12px;
    }

    .local-action-grid > div {
      min-width: 0;
      padding: 12px;
      border: 1px solid rgba(37, 99, 235, 0.16);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.72);
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }

    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      background: var(--surface-2);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    tr:last-child td { border-bottom: 0; }

    .visual-blocks {
      display: grid;
      gap: 12px;
    }

    .visual-block {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }

    .visual-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
    }

    .visual-header > div {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .visual-header > span {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      text-transform: lowercase;
    }

    .visual-header strong,
    .range-label strong,
    .rank-main strong,
    .status-item strong {
      overflow-wrap: anywhere;
    }

    .visual-header span,
    .visual-note,
    .range-label span,
    .rank-main span,
    .status-item span,
    .score-cell small {
      color: var(--muted);
      font-size: 12px;
    }

    .visual-body {
      padding: 14px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .status-item {
      display: grid;
      gap: 6px;
      min-height: 96px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-2);
    }

    .status-item b {
      color: var(--amber);
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    .rank-list,
    .range-list {
      display: grid;
      gap: 12px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: minmax(140px, 1fr) minmax(180px, 2fr) 54px;
      gap: 12px;
      align-items: center;
    }

    .rank-main {
      display: grid;
      gap: 2px;
    }

    .bar-track,
    .range-track {
      position: relative;
      min-height: 12px;
      border-radius: 999px;
      background: var(--surface-2);
      overflow: hidden;
    }

    .bar-fill {
      display: block;
      width: var(--score);
      height: 12px;
      border-radius: 999px;
      background: var(--amber);
    }

    .rank-score {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-align: right;
    }

    .score-cell span {
      display: grid;
      gap: 2px;
      min-width: 94px;
      padding: 8px;
      border-radius: 6px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--amber) 24%, transparent) var(--score), color-mix(in srgb, var(--amber) 7%, transparent) var(--score));
    }

    .score-cell strong {
      font-size: 14px;
    }

    .range-row {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) minmax(220px, 2fr) minmax(120px, auto);
      gap: 12px;
      align-items: center;
    }

    .range-label {
      display: grid;
      gap: 2px;
    }

    .range-band {
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--left);
      width: var(--width);
      border-radius: 999px;
      background: color-mix(in srgb, var(--amber) 48%, var(--surface));
    }

    .range-marker {
      position: absolute;
      top: -3px;
      left: var(--marker);
      width: 4px;
      height: 18px;
      border-radius: 999px;
      background: var(--red);
      transform: translateX(-50%);
    }

    .range-values {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
    }

    .visual-note {
      margin-top: 10px;
    }

    .list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding-left: 18px;
    }

    .tool {
      padding: 18px;
      display: grid;
      gap: 14px;
      background: var(--surface-2);
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
      color: var(--ink);
      background: var(--surface);
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #c7d2e1;
      background: #ffffff;
      color: var(--ink);
      border-radius: 6px;
      min-height: 38px;
      padding: 8px 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
    }

    .footer {
      color: rgba(71, 85, 105, 0.86);
      font-size: 13px;
      padding: 18px 2px 40px;
    }

    @media (max-width: 960px) {
      .layout { display: block; }
      .rail {
        position: static;
        height: auto;
      }
      .nav {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .summary-grid,
      .decision-board,
      .meta-grid,
      .metrics,
      .status-grid,
      .local-action-grid,
      .coverage-list,
      .source-wall,
      .price-ladder,
      .channel-cards,
      .timeline-row,
      .competitor-stack,
      .rank-row,
      .range-row,
      .tool-grid {
        grid-template-columns: 1fr;
      }
      .rank-score,
      .range-values {
        text-align: left;
      }
      .main { padding: 18px; }
      .hero h2 { font-size: 28px; }
    }

    @media (max-width: 520px) {
      .nav {
        grid-template-columns: 1fr;
      }
      .nav a small {
        display: none;
      }
      .hero {
        padding: 22px;
      }
      .hero-top {
        display: grid;
        justify-content: start;
      }
      .hero-top .badge {
        justify-self: start;
      }
      .hero h2 {
        font-size: 25px;
      }
      .decision-main h3 {
        font-size: 21px;
      }
      .fact-list li {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }

    @media print {
      body { background: #ffffff; }
      .layout { display: block; }
      .rail { display: none; }

      function toPercent(value, min, max) {
        const floor = toNumber(min, 0);
        const ceiling = toNumber(max, 100);
        const range = ceiling - floor || 1;
        return clamp(((toNumber(value, floor) - floor) / range) * 100, 0, 100).toFixed(1) + "%";
      }

      function includesText(value, needle) {
        return text(value).indexOf(needle) >= 0;
      }

      function shortText(value, max) {
        const raw = text(value);
        return raw.length > max ? raw.slice(0, max - 1) + "…" : raw;
      }

      function sectionById(id) {
        return (data.sections || []).find(function (section) { return section.section_id === id; }) || {};
      }

      function visualByTitle(sectionId, titleNeedle) {
        const section = sectionById(sectionId);
        return (section.visual_blocks || section.charts || []).find(function (block) {
          return includesText(block.title, titleNeedle);
        }) || {};
      }

      function statusTone(value) {
        const raw = text(value);
        if (/不足|待补|待确认|缺|低|阻断/.test(raw)) return "var(--red)";
        if (/中|假设|需|较强/.test(raw)) return "var(--amber)";
        return "var(--green)";
      }

      function renderExecutiveBoard(takeaways) {
        const project = data.project || {};
        const priceBlock = visualByTitle("pricing", "本地价格锚点");
        const competitorBlock = visualByTitle("market_context", "竞品压力");
        const channelBlock = visualByTitle("launch_forecast", "渠道分配");
        const topCompetitor = (competitorBlock.items && competitorBlock.items[0] && competitorBlock.items[0].label) || "待确认";
        const topChannel = (channelBlock.rows && channelBlock.rows[0] && channelBlock.rows[0].label) || "待确认";
        const targetPrice = (priceBlock.items || []).find(function (item) { return includesText(item.label, "FIT 5 Pro"); }) || {};
        const factLabels = ["价格", "外部竞品", "内部梯度", "消费者声音", "销量预测"];
        const factHtml = (takeaways || []).slice(0, 5).map(function (item, index) {
          return '<li><b>' + escapeHtml(factLabels[index] || "事实") + '</b><span>' + escapeHtml(item) + '</span></li>';
        }).join("");
        return '<div class="decision-main">' +
          '<p class="eyebrow">给管理层的摘要</p>' +
          '<h3>' + escapeHtml((targetPrice.value_label || project.priceRange || "目标价格") + " 可守，关键在证明栈、交易机制与本地渠道执行") + '</h3>' +
          '<ul class="fact-list">' + factHtml + '</ul>' +
        '</div>' +
        '<aside class="decision-side" aria-label="关键决策指标">' +
          '<div class="fact-card"><span>价格锚点</span><strong>' + escapeHtml(targetPrice.value_label || project.priceRange || "待确认") + '</strong><small>' + escapeHtml(targetPrice.note || "价格已定时，看合理性与证明强度") + '</small></div>' +
          '<div class="fact-card"><span>TOP1 竞品</span><strong>' + escapeHtml(topCompetitor) + '</strong><small>优先处理低价、生态与续航对照</small></div>' +
          '<div class="fact-card"><span>渠道优先级</span><strong>' + escapeHtml(topChannel) + '</strong><small>正式版必须直接落到本地渠道名</small></div>' +
          '<div class="fact-card"><span>当前门禁</span><strong>' + escapeHtml(project.status || "needs_validation") + '</strong><small>买家声音、MKT 响应、渠道承诺仍需补证</small></div>' +
        '</aside>';
      }

      function renderSourceTiles() {
        const citations = data.citations || [];
        if (!citations.length) return "";
        return '<div class="source-wall">' + citations.slice(0, 8).map(function (citation) {
          const source = citation.source || citation.title || "Source";
          const initials = source.split(/\s+/).map(function (part) { return part[0]; }).join("").slice(0, 2).toUpperCase();
          const label = citation.url
            ? '<a href="' + escapeHtml(citation.url) + '" target="_blank" rel="noreferrer">' + escapeHtml(shortText(citation.title || source, 42)) + '</a>'
            : '<strong>' + escapeHtml(shortText(citation.title || source, 42)) + '</strong>';
          return '<div class="source-tile">' +
            '<span class="source-mark">' + escapeHtml(initials || "S") + '</span>' +
            '<div>' + label + '<span>' + escapeHtml(source) + '</span></div>' +
          '</div>';
        }).join("") + '</div>';
      }

      function renderEvidenceCoverage(block) {
        const items = block.items || [];
        const body = renderSourceTiles() + '<div class="coverage-list">' + items.map(function (item) {
          return '<div class="coverage-item">' +
            '<strong>' + escapeHtml(item.label || item.title || "来源") + '<b style="color:' + statusTone(item.value || item.status) + '">' + escapeHtml(item.value || item.status || "") + '</b></strong>' +
            '<small>' + escapeHtml(item.note || item.source || "") + '</small>' +
          '</div>';
        }).join("") + '</div>';
        return renderVisualShell(block, body);
      }

      function renderCompetitorStack(block) {
        const max = toNumber(block.max, 100);
        const items = block.items || [];
        const body = '<div class="competitor-stack">' + items.map(function (item, index) {
          const score = toNumber(item.score, 0);
          return '<div class="competitor-card">' +
            '<div class="competitor-rank">' + escapeHtml(String(index + 1)) + '</div>' +
            '<div><span>竞争压力 ' + escapeHtml(item.score_label || String(score)) + '</span>' +
            '<strong>' + escapeHtml(item.label || item.name || "竞品") + '</strong>' +
            '<div class="price-scale"><span style="--score:' + toPercent(score, 0, max) + '"></span></div>' +
            '<p>' + escapeHtml(item.note || item.reason || "") + '</p></div>' +
          '</div>';
        }).join("") + '</div>';
        return renderVisualShell(block, body);
      }

      function renderPriceLadder(block) {
        const scaleMin = toNumber(block.scale_min, 50000);
        const scaleMax = toNumber(block.scale_max, 120000);
        const colors = ["var(--blue)", "var(--green)", "var(--amber)", "var(--red)"];
        const items = (block.items || []).slice().sort(function (a, b) {
          return toNumber(a.marker || a.min, 0) - toNumber(b.marker || b.min, 0);
        });
        const body = '<div class="price-ladder">' + items.map(function (item, index) {
          const marker = toNumber(item.marker || item.min, scaleMin);
          return '<div class="price-card" style="--price-tone:' + colors[index % colors.length] + '">' +
            '<span>' + escapeHtml(item.label || "价格锚点") + '</span>' +
            '<strong>' + escapeHtml(item.value_label || (String(item.min) + "-" + String(item.max))) + '</strong>' +
            '<p>' + escapeHtml(item.note || "") + '</p>' +
            '<div class="price-scale"><span style="--score:' + toPercent(marker, scaleMin, scaleMax) + '"></span></div>' +
          '</div>';
        }).join("") + '</div>';
        return renderVisualShell(block, body);
      }

      function metricFromValue(value, index) {
        if (typeof value === "object" && value !== null) {
          return { score: toNumber(value.score, 0), label: value.label || String(value.score || "") };
        }
        return { score: toNumber(value, 0), label: String(value || "") };
      }

      function renderChannelCards(block) {
        const columns = block.columns || block.headers || [];
        const rows = block.rows || [];
        const body = '<div class="channel-cards">' + rows.map(function (row) {
          const values = row.values || [];
          const meters = columns.slice(0, 4).map(function (column, index) {
            const metric = metricFromValue(values[index], index);
            return '<div class="mini-meter"><small><span>' + escapeHtml(column) + '</span><b>' + escapeHtml(metric.label) + '</b></small><i style="--score:' + toPercent(metric.score, 0, 100) + '"></i></div>';
          }).join("");
          return '<div class="channel-card">' +
            '<span>' + escapeHtml(row.note || "本地渠道") + '</span>' +
            '<strong>' + escapeHtml(row.label || row.name || "渠道") + '</strong>' +
            '<div class="mini-meters">' + meters + '</div>' +
          '</div>';
        }).join("") + '</div>';
        return renderVisualShell(block, body);
      }

      function renderDemandTimeline(block) {
        const scaleMax = toNumber(block.scale_max, 500);
        const items = block.items || [];
        const body = '<div class="timeline-row">' + items.map(function (item) {
          const marker = item.marker === undefined ? toNumber(item.max, scaleMax) : toNumber(item.marker, 0);
          return '<div class="timeline-card">' +
            '<span>' + escapeHtml(item.label || "阶段") + '</span>' +
            '<strong>' + escapeHtml(item.value_label || (String(item.min) + "-" + String(item.max))) + '</strong>' +
            '<p>' + escapeHtml(item.note || "") + '</p>' +
            '<i style="--score:' + toPercent(marker, 0, scaleMax) + '"></i>' +
          '</div>';
        }).join("") + '</div>';
        return renderVisualShell(block, body);
      }

      function renderVisualRefs(block) {
        const rawRefs = block.evidence_refs || block.citations || [];
        const refs = Array.isArray(rawRefs) ? rawRefs : [rawRefs];
        if (!refs.length) return "";
        const labels = refs.slice(0, 6).map(function (ref) {
          if (typeof ref === "string") return ref;
          return ref.ref || ref.evidence_id || ref.id || ref.title || "";
        }).filter(Boolean);
        if (!labels.length) return "";
        const overflow = refs.length > labels.length ? " +" + (refs.length - labels.length) : "";
        return '<div class="visual-note">证据 refs: ' + labels.map(escapeHtml).join(", ") + escapeHtml(overflow) + '</div>';
      }

      function renderVisualShell(block, body) {
        const typeLabel = text(block.visual || block.type || "visual").replace(/_/g, " ");
        return '<div class="visual-block">' +
          '<div class="visual-header"><div><strong>' + escapeHtml(block.title || "证据视图") + '</strong>' +
          (block.subtitle || block.core_point ? '<span>' + escapeHtml(block.subtitle || block.core_point) + '</span>' : "") +
          '</div><span>' + escapeHtml(typeLabel) + '</span></div>' +
          '<div class="visual-body">' + body +
          (block.note ? '<div class="visual-note">' + escapeHtml(block.note) + '</div>' : "") +
          renderVisualRefs(block) +
          '</div></div>';
      }

      function renderStatusPanel(block) {
        if (includesText(block.title, "证据覆盖门禁")) return renderEvidenceCoverage(block);
        const items = block.items || [];
        const body = items.length ? '<div class="status-grid">' + items.map(function (item) {
          return '<div class="status-item">' +
            '<strong>' + escapeHtml(item.label || item.title || "状态") + '</strong>' +
            '<b>' + escapeHtml(item.value || item.status || "") + '</b>' +
            '<span>' + escapeHtml(item.note || item.owner || item.source || "") + '</span>' +
          '</div>';
        }).join("") + '</div>' : renderList([]);
        return renderVisualShell(block, body);
      }

      function renderRankedBars(block) {
        if (includesText(block.title, "竞品压力")) return renderCompetitorStack(block);
        const max = toNumber(block.max, 100);
        const items = block.items || [];
        const body = items.length ? '<div class="rank-list">' + items.map(function (item) {
          const score = toNumber(item.score, 0);
          return '<div class="rank-row">' +
            '<div class="rank-main"><strong>' + escapeHtml(item.label || item.name || "项目") + '</strong><span>' + escapeHtml(item.note || item.reason || "") + '</span></div>' +
            '<div class="bar-track"><span class="bar-fill" style="--score: ' + toPercent(score, 0, max) + '"></span></div>' +
            '<div class="rank-score">' + escapeHtml(item.score_label || String(score)) + '</div>' +
          '</div>';
        }).join("") + '</div>' : renderList([]);
        return renderVisualShell(block, body);
      }

      function renderMatrixHeatmap(block) {
        if (includesText(block.title, "渠道分配") || includesText(block.title, "本地渠道")) return renderChannelCards(block);
        const columns = block.columns || block.headers || [];
        const rows = block.rows || [];
        const max = toNumber(block.max, 100);
        if (!columns.length || !rows.length) return renderVisualShell(block, renderList([]));
        const table = '<div class="table-wrap"><table><thead><tr><th>' + escapeHtml(block.row_label || "维度") + '</th>' +
          columns.map(function (col) { return '<th>' + escapeHtml(col) + '</th>'; }).join("") +
          '</tr></thead><tbody>' +
          rows.map(function (row) {
            const values = row.values || [];
            return '<tr><td><strong>' + escapeHtml(row.label || row.name || "") + '</strong><div class="source">' + escapeHtml(row.note || "") + '</div></td>' +
              columns.map(function (_col, index) {
                const value = values[index] || {};
                const score = typeof value === "object" ? toNumber(value.score, 0) : toNumber(value, 0);
                const label = typeof value === "object" ? (value.label || String(score)) : String(score);
                const note = typeof value === "object" ? (value.note || "") : "";
                return '<td class="score-cell"><span style="--score: ' + toPercent(score, 0, max) + '">' +
                  '<strong>' + escapeHtml(label) + '</strong>' +
                  (note ? '<small>' + escapeHtml(note) + '</small>' : "") +
                '</span></td>';
              }).join("") + '</tr>';
          }).join("") + '</tbody></table></div>';
        return renderVisualShell(block, table);
      }

      function renderRangeChart(block) {
        if (includesText(block.title, "本地价格锚点")) return renderPriceLadder(block);
        if (includesText(block.title, "30/60/90")) return renderDemandTimeline(block);
        const scaleMin = toNumber(block.scale_min, 0);
        const scaleMax = toNumber(block.scale_max, 100);
        const items = block.items || [];
        const body = items.length ? '<div class="range-list">' + items.map(function (item) {
          const min = toNumber(item.min, scaleMin);
          const max = toNumber(item.max, scaleMax);
          const marker = item.marker === undefined ? null : toNumber(item.marker, min);
          const left = toPercent(min, scaleMin, scaleMax);
          const right = toPercent(max, scaleMin, scaleMax);
          const width = (parseFloat(right) - parseFloat(left)).toFixed(1) + "%";
          const markerHtml = marker === null ? "" : '<span class="range-marker" style="--marker: ' + toPercent(marker, scaleMin, scaleMax) + '"></span>';
          return '<div class="range-row">' +
            '<div class="range-label"><strong>' + escapeHtml(item.label || "区间") + '</strong><span>' + escapeHtml(item.note || "") + '</span></div>' +
            '<div class="range-track"><span class="range-band" style="--left: ' + left + '; --width: ' + width + '"></span>' + markerHtml + '</div>' +
            '<div class="range-values">' + escapeHtml(item.value_label || (String(min) + " - " + String(max))) + '</div>' +
          '</div>';
        }).join("") + '</div>' : renderList([]);
        return renderVisualShell(block, body);
      }

      function renderVisualBlocks(blocks) {
        if (!blocks || !blocks.length) return "";
        return '<div class="visual-blocks">' + blocks.map(function (block) {
          const type = slug(block.type || block.visual || "");
          if (type === "status_panel") return renderStatusPanel(block);
          if (type === "ranked_bar") return renderRankedBars(block);
          if (type === "matrix_heatmap") return renderMatrixHeatmap(block);
          if (type === "range_chart") return renderRangeChart(block);
          if (block.headers && block.rows) return renderVisualShell(block, renderTables([{ headers: block.headers, rows: block.rows }]));
          return renderVisualShell(block, renderList(block.items || []));
        }).join("") + '</div>';
      }

      function renderSection(section) {
        const id = section.section_id || slug(section.section_title);
        const narrative = section.narrative_blocks || [];
        return '<section class="section" id="' + escapeHtml(id) + '">' +
          '<div class="section-header"><div>' +
            '<h3>' + escapeHtml(section.section_title || id) + '</h3>' +
            '<div class="source">' + escapeHtml(section.source_skill || "未知来源") + '</div>' +
          '</div>' + badge(section.confidence || section.status || "unknown") + '</div>' +
          (section.executive_takeaway ? '<p><strong>核心结论：</strong> ' + escapeHtml(section.executive_takeaway) + '</p>' : "") +
          narrative.map(function (block) { return '<p>' + escapeHtml(block) + '</p>'; }).join("") +
          renderLocalTeamAction(section) +
          renderMetricCards(section.metric_cards) +
          renderCallouts(section.callouts) +
          renderVisualBlocks(section.visual_blocks || section.charts) +
          renderTables(section.tables) +
          (section.next_actions && section.next_actions.length ? '<div class="callout"><strong>下一步行动</strong>' + renderList(section.next_actions) + '</div>' : "") +
          (section.data_gaps && section.data_gaps.length ? '<div class="callout warning"><strong>本节数据缺口</strong>' + renderList(section.data_gaps) + '</div>' : "") +
        '</section>';
      }

      function renderPrivateCalculator() {
        const spec = data.privatePricingCalculator || {};
        if (!spec.enabled) return "";
        return '<section class="section" id="private_pricing_calculator">' +
          '<div class="section-header"><div><h3>私有价格与毛利计算器</h3>' +
          '<div class="source">仅在本地浏览器计算。默认空值且不存储。</div></div>' +
          '<span class="badge hypothesis_only">仅本地</span></div>' +
          '<div class="tool">' +
            '<div class="callout warning"><strong>隐私提示</strong><div>这里输入的数值只保留在浏览器内存中，除非你主动复制派生摘要。</div></div>' +
            '<div class="tool-grid">' +
              '<label>建议零售价<input id="calc-msrp" type="number" min="0" step="0.01" placeholder="0.00"></label>' +
              '<label>COGS / BOM 成本<input id="calc-cogs" type="number" min="0" step="0.01" placeholder="0.00"></label>' +
              '<label>目标毛利率 %<input id="calc-target-gm" type="number" min="0" max="99" step="0.1" placeholder="35"></label>' +
              '<label>渠道费用<input id="calc-channel" type="number" min="0" step="0.01" placeholder="0.00"></label>' +
              '<label>折扣<input id="calc-discount" type="number" min="0" step="0.01" placeholder="0.00"></label>' +
              '<label>物流/支付补贴<input id="calc-subsidy" type="number" min="0" step="0.01" placeholder="0.00"></label>' +
            '</div>' +
            '<div class="metrics" id="calc-results"></div>' +
            '<div class="actions"><button class="primary" id="calc-run" type="button">计算</button><button id="calc-reset" type="button">重置</button><button id="calc-copy" type="button">复制派生摘要</button></div>' +
          '</div>' +
        '</section>';
      }

      function readNumber(id) {
        const value = document.getElementById(id).value;
        const num = Number(value);
        return Number.isFinite(num) ? num : 0;
      }

      function formatMoney(value) {
        return Number.isFinite(value) ? value.toFixed(2) : "0.00";
      }

      function formatPercent(value) {
        return Number.isFinite(value) ? (value * 100).toFixed(1) + "%" : "0.0%";
      }

      function runCalculator() {
        const msrp = readNumber("calc-msrp");
        const cogs = readNumber("calc-cogs");
        const targetGm = readNumber("calc-target-gm") / 100;
        const channel = readNumber("calc-channel");
        const discount = readNumber("calc-discount");
        const subsidy = readNumber("calc-subsidy");
        const net = msrp - channel - discount - subsidy;
        const gm = net > 0 ? (net - cogs) / net : 0;
        const minNet = targetGm < 1 ? cogs / (1 - targetGm) : 0;
        const gap = net - minNet;
        const cards = [
          { label: "估算净价", value: formatMoney(net), note: "建议零售价减去可见扣减" },
          { label: "毛利率", value: formatPercent(gm), note: "本地计算" },
          { label: "毛利缺口", value: formatMoney(gap), note: gap >= 0 ? "达到或高于底线" : "低于底线" }
        ];
        document.getElementById("calc-results").innerHTML = renderMetricCards(cards);
        window.__derivedPricingSummary = "估算净价：" + formatMoney(net) + "；毛利率：" + formatPercent(gm) + "；毛利缺口：" + formatMoney(gap) + "。";
      }

      function resetCalculator() {
        ["calc-msrp", "calc-cogs", "calc-target-gm", "calc-channel", "calc-discount", "calc-subsidy"].forEach(function (id) {
          const el = document.getElementById(id);
          if (el) el.value = "";
        });
        document.getElementById("calc-results").innerHTML = "";
        window.__derivedPricingSummary = "";
      }

      function copySummary() {
        const summary = window.__derivedPricingSummary || "尚未计算派生价格摘要。";
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(summary);
        }
      }

      function initCalculator() {
        const run = document.getElementById("calc-run");
        if (!run) return;
        run.addEventListener("click", runCalculator);
        document.getElementById("calc-reset").addEventListener("click", resetCalculator);
        document.getElementById("calc-copy").addEventListener("click", copySummary);
      }

      function init() {
        const project = data.project || {};
        const sections = data.sections || [];
        document.title = project.title || "GTM 看板";
        document.getElementById("rail-title").textContent = project.product || project.title || "GTM 看板";
        document.getElementById("rail-subtitle").textContent = project.country || "静态报告";
        document.getElementById("report-kicker").textContent = data.mode === "template_preview" ? "模板预览" : "GTM 报告";
        document.getElementById("report-title").textContent = project.title || "GTM 看板";
        document.getElementById("report-status").outerHTML = badge(project.status || "unknown");

        const meta = [
          { label: "产品", value: project.product || "未提供" },
          { label: "国家/地区", value: project.country || "未提供" },
          { label: "价格段", value: project.priceRange || "未提供" },
          { label: "受众", value: project.audience || "混合" }
        ];
        document.getElementById("meta-grid").innerHTML = meta.map(function (item) {
          return '<div class="meta"><span>' + escapeHtml(item.label) + '</span><strong>' + escapeHtml(item.value) + '</strong></div>';
        }).join("");

        const takeaways = data.executiveTakeaways && data.executiveTakeaways.length
          ? data.executiveTakeaways
          : sections.map(function (s) { return s.executive_takeaway; }).filter(Boolean).slice(0, 5);
        document.getElementById("summary-content").innerHTML = renderList(takeaways);
        document.getElementById("gap-content").innerHTML = renderList(data.dataGaps || []);
        document.getElementById("decision-board").innerHTML = renderExecutiveBoard(takeaways);

        const navItems = [
          { id: "executive_summary", title: "摘要", status: "core" },
          { id: "gap-panel", title: "数据缺口", status: "core" }
        ].concat(sections.map(function (s) {
          return { id: s.section_id || slug(s.section_title), title: s.section_title || s.section_id, status: s.confidence || "" };
        })).concat([{ id: "citations", title: "证据索引", status: "index" }]);

        document.getElementById("nav").innerHTML = navItems.map(function (item) {
          return '<a href="#' + escapeHtml(item.id) + '"><span>' + escapeHtml(item.title) + '</span><small>' + escapeHtml(item.status) + '</small></a>';
        }).join("");

        document.getElementById("sections").innerHTML = sections.map(renderSection).join("") + renderPrivateCalculator();

        const citations = data.citations || [];
        document.getElementById("citation-content").innerHTML = citations.length
          ? renderTables([{ headers: ["Ref", "标题", "来源"], rows: citations.map(function (c) { return [c.ref || "", c.title || "", c.source || c.url || ""]; }) }])
          : '<p class="source">未提供证据索引。缺失的 citation metadata 应由 S14 质量门标记。</p>';

        initCalculator();
      }

      init();
    }());
  </script>
</body>
</html>
